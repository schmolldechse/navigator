name: Build Projects

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'daemon/**'
      - 'backend/**'
  pull_request:
    paths:
      - 'daemon/**'
      - 'backend/**'

jobs:
  check-daemon-formatting:
    name: Check Code Formatting for Daemon
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dotnet-format
      run: dotnet tool install -g dotnet-format

    - name: Run dotnet-format
      run: dotnet format daemon/daemon.sln --verify-no-changes

  format-swift:
    name: Check Code Formatting for Backend
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.1.0"

    - name: Verify Swift Version
      run: swift --version

    - name: Check Swift formatting
      run: swift format lint --recursive Sources/ Tests/
      working-directory: backend